<title>Timepass system context (C4 level 1)</title>
<desc>A Mac user picks timezones and display format in Timepass; a maintainer builds it from source and regenerates its zone catalog. Timepass draws flag and time clocks in the macOS menu bar, registers with login items, persists choices in UserDefaults and reads zones and offsets from the macOS time zone data.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

